name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test and package
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: Scripts/ci-test.sh 420

      - name: Forced-termination recovery
        run: Scripts/crash-recovery-test.sh 15

      - name: Build the app bundle
        run: Scripts/build-app.sh

      - name: End-to-end demo export
        run: |
          KIRIE=dist/Kirie.app/Contents/Helpers/kirie
          "$KIRIE" demo "$RUNNER_TEMP/demo" --compact
          "$KIRIE" validate "$RUNNER_TEMP/demo/Kirie Demo.kirie" --compact
          "$KIRIE" export "$RUNNER_TEMP/demo/Kirie Demo.kirie" --sequence "Strip reel" --out "$RUNNER_TEMP/strip-reel.mp4" --compact
          "$KIRIE" probe "$RUNNER_TEMP/strip-reel.mp4" --compact

      - name: Package
        run: ditto -c -k --keepParent dist/Kirie.app dist/Kirie-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Kirie-macos-arm64
          path: dist/Kirie-macos-arm64.zip
          retention-days: 14
          if-no-files-found: error
